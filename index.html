<style>
  @font-face { font-family: "Pixelify Sans"; src: url("assets/fonts/PixelifySans.ttf"); }

    background: rgba(5, 6, 15, 0.94); color: #d8e8ff; font: 22px "Pixelify Sans", "Courier New", monospace; text-align: center; }
  #rotate b { color: #80f0ff; font-weight: normal; font-size: 30px; }
  #rotate button { font: inherit; padding: 12px 22px; border: 0; background: #40c8e0; color: #06101a; cursor: pointer; }
</style>
